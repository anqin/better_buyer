# API / PWA 配置
host: 0.0.0.0
port: 8000
public_base_url: "http://localhost:8000"

auth:
  access_token_minutes: 15
  refresh_token_days: 30
  pairing_code_ttl_seconds: 120
  pairing_max_attempts: 5

push:
  vapid_public_key_env: BB_VAPID_PUBLIC_KEY
  vapid_private_key_env: BB_VAPID_PRIVATE_KEY
  subject: "mailto:better-buyer@localhost"

sse:
  keepalive_seconds: 15
