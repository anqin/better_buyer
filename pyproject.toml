[project]
name = "better-buyer"
version = "1.0.0"
description = "品类可插拔、多模型协同决策的优惠券采集、盯盘预测与半自动购买系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.42"]
push = ["pywebpush>=1.14"]

[project.scripts]
better-buyer = "better_buyer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/better_buyer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
